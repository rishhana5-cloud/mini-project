{% extends  'app1/base.html'%}

{% block content %}
<div class="container mt-5 ">
  <div class="row ">
    <div class="col-md-6 d-flex justify-content-center align-items-center">
      <img src="{{ product.image.url }}" class="rounded-4 " width="250">
    </div>
    <div class="col-md-6">
      <h2 class="fw-bold">{{product.name }}</h2>
      <h4>₹ {{product.price }}</h4>
      <p class="mt-3">{{ product.Description }}</p>
      <a href="{% url 'cart' %}" class="btn btn-dark rounded-pill px-4 mt-3">ADD TO CART</a>
       <a href="{% url 'buy' product.id %}" class="btn btn-dark rounded-pill px-4 mt-3">BUY NOW</a>
    </div>
  </div>
</div>
{%endblock%}
