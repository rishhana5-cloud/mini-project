{% extends  'app1/base.html'%}
{% block content%}

<div class="container mt-4">

<table class="table table-hover text-center ">
   <tr>
   <th>PRODUCT</th>
   <th>QUANTITY</th>
   <th>PRICE</th>
   </tr>
    {%for i in cart%}
   <tr>
     <td><img src="{{i.product.image.url}}" width="80"></td>
     <td> {{i.quantity}}<a href="{% url 'plus' i.id %}" class="btn btn-sm px-2 text-decoration-none fw-bold btn-light border">+</a>  <a href="{% url 'dlt' i.id %}" class="btn btn-sm px-2 text-decoration-none fw-bold btn-light border">-</a></td>
     <td>{{i.product.price}}</td>
     <td> <a href="{% url 'buy' i.id %}" class="btn btn-dark btn-primary">Buy Now</a> </td>
     
   </tr>
     {% endfor%}
</table>
</div>

{% endblock%}
