{% extends  'app1/base.html'%}
{% block content%}
<div class="container mt-4">
<table class="table table-hover text-center ">
   <tr>
   <th>PRODUCT</th>
   <th>QUANTITY</th>
   <th>PRICE</th>
   <th>ADRESS</th>
   <th>ORDER DATE</th>
   </tr>
  
    {%for i in orders %}
   <tr>
     <td>{{i.product.name}}</td>
     <td> {{i.quantity}}</td>
     <td>{{i.product.price}}</td>
     <td> {{i.address}}</td>
     <td>{{i.ordered_at}}</td>
   </tr>
     {% endfor%}

</table>
</div>

{% endblock%}
